name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"

jobs:
  python:
    name: Worker (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # CPU torch keeps the job at a couple of minutes instead of pulling
        # the full CUDA wheel, which nothing in the default suite uses.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "worker[dev]"

      - name: Generate gRPC stubs
        run: ./scripts/gen_proto.sh

      - name: Lint
        run: |
          ruff check worker
          black --check worker

      - name: Test
        working-directory: worker
        run: python -m pytest -v --tb=short

  rust:
    name: Gateway (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        # tonic-build compiles proto/inference.proto during `cargo build`.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  stack:
    name: Docker stack
    runs-on: ubuntu-latest
    needs: [python, rust]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for the gateway
        # The worker downloads gpt2 and loads it before reporting ready, so the
        # gateway answers /health well before the stack can serve a request.
        run: |
          timeout 300 bash -c '
            until curl -fsS http://localhost:8080/health | grep -q "\"ready\":true"; do
              echo "waiting for a ready worker..."
              sleep 5
            done
          '

      - name: Complete a request end to end
        run: |
          curl -fsS -X POST http://localhost:8080/v1/completions \
            -H "Content-Type: application/json" \
            -d '{"prompt": "The capital of France is", "max_tokens": 8}' \
            | tee /dev/stderr | grep -q '"object":"text_completion"'

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
