syntax = "proto3";

package inference;

// Tessera worker inference service.
//
// Generate is unary. GenerateStream emits one message per token as it is
// decoded, which continuous batching (Phase 2) makes possible: the scheduler
// advances every running sequence one token per iteration, so a token is
// available to forward long before the completion is finished.
service Inference {
  // Generate a completion for a single prompt.
  rpc Generate (GenerateRequest) returns (GenerateResponse);

  // Stream a completion token by token. Each message carries the newly
  // decoded text only; the final message sets finished and finish_reason.
  rpc GenerateStream (GenerateRequest) returns (stream GenerateResponse);

  // Liveness / capacity probe. The gateway uses in_flight for
  // least-in-flight routing and load shedding.
  rpc Health (HealthRequest) returns (HealthResponse);
}

message GenerateRequest {
  string prompt = 1;
  int32 max_tokens = 2;

  // Ignored by Generate; GenerateStream always streams. Retained so a client
  // built against the Phase 1 schema still parses.
  bool stream = 3;

  // Sampling controls. temperature <= 0 means greedy (argmax), which is the
  // Phase 1 default and the mode used by all equivalence tests.
  float temperature = 4;
  float top_p = 5;
  uint64 seed = 6;

  // Client-supplied id, echoed back for tracing. Generated by the gateway
  // when empty.
  string request_id = 7;
}

message GenerateResponse {
  // Generated continuation only, NOT including the prompt. On a stream this
  // is the delta for one token, not the text so far.
  string text = 1;
  bool finished = 2;

  string request_id = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;

  // "length" (hit max_tokens) or "stop" (hit EOS).
  string finish_reason = 6;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string model = 2;
  string device = 3;
  // Requests currently executing on this worker.
  int32 in_flight = 4;
}
