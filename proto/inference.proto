syntax = "proto3";

package inference;

// Tessera worker inference service.
//
// Phase 1 implements unary Generate + Health. The `stream` request field is
// accepted but rejected with INVALID_ARGUMENT until continuous batching
// (Phase 2) provides token-at-a-time emission.
service Inference {
  // Generate a completion for a single prompt.
  rpc Generate (GenerateRequest) returns (GenerateResponse);

  // Liveness / capacity probe. The gateway uses in_flight for
  // least-in-flight routing and load shedding.
  rpc Health (HealthRequest) returns (HealthResponse);
}

message GenerateRequest {
  string prompt = 1;
  int32 max_tokens = 2;
  bool stream = 3;

  // Sampling controls. temperature <= 0 means greedy (argmax), which is the
  // Phase 1 default and the mode used by all equivalence tests.
  float temperature = 4;
  float top_p = 5;
  uint64 seed = 6;

  // Client-supplied id, echoed back for tracing. Generated by the gateway
  // when empty.
  string request_id = 7;
}

message GenerateResponse {
  // Generated continuation only, NOT including the prompt.
  string text = 1;
  bool finished = 2;

  string request_id = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;

  // "length" (hit max_tokens) or "stop" (hit EOS).
  string finish_reason = 6;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string model = 2;
  string device = 3;
  // Requests currently executing on this worker.
  int32 in_flight = 4;
}
