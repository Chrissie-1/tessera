[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-worker"
version = "0.1.0"
description = "Tessera inference worker: paged KV cache, continuous batching, speculative decoding"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Chrissie Raj"},
]
keywords = ["inference", "llm", "ml", "gpu", "batching", "speculative-decoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10"
dependencies = [
    # transformers 5.0 is a hard floor, not caution: the engines read
    # `past_key_values.layers[i].keys`, and before v5 a forward pass returned a
    # legacy tuple. On 4.54 the paged tests fail with
    # "'tuple' object has no attribute 'layers'".
    # torch 2.5 is what transformers 5.x expects and what the image pins.
    "torch>=2.5",
    "transformers>=5.0",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    # uvicorn is a console script (see `make run-api`), not an import.
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The Phase 4 attention kernel. Triton only runs on CUDA, so it is kept out
# of the default install: the CPU path in attention.py is what CI exercises.
gpu = [
    "triton>=3.0",
]
dev = [
    "grpcio-tools>=1.60",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/Chrissie-1/tessera"
Repository = "https://github.com/Chrissie-1/tessera"
Issues = "https://github.com/Chrissie-1/tessera/issues"

[project.scripts]
tessera-worker = "tessera_worker.server:serve"

[tool.setuptools.packages.find]
include = ["tessera_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that load a real (non-tiny) model or run long decodes",
    "gpu: tests that require CUDA",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# Generated protobuf stubs are not ours to lint.
extend-exclude = ["tessera_worker/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "tessera_worker/generated"
